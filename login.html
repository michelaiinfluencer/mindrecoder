<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MindRecoder</title>
    <link rel="icon" href="Assets/Logo/mrLogo.png" type="image/png">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <a href="index.html" class="btn btn-outline" style="position: absolute; top: 30px; right: 5%; z-index: 100;">Return
        to Main</a>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="centered-container">
        <div class="auth-card glass">
            <img src="Assets/Logo/mrLogo.png" alt="Logo" style="width: 300px; height: 300px;">

            <div style="margin-bottom: 24px; margin-top: -24px;">
                <input type="text" id="accessCode" placeholder="Use your Email to login"
                    style="width: 100%; padding: 15px; border-radius: 12px; background: rgba(0,0,0,0.4); border: 2px solid var(--glass-border); color: white; font-size: 1rem; text-align: center; letter-spacing: 2px;">
                <p id="errorMsg" style="color: #ff4d4d; font-size: 0.8rem; margin-top: 10px; display: none;">Invalid
                    Neural Access Code</p>
            </div>

            <button onclick="validateCode()" class="btn btn-primary" style="width: 100%;">Initialize Session</button>

            <p style="margin-top: 24px; font-size: 0.8rem; color: var(--text-secondary);">Unauthorized access is
                strictly monitored.</p>
        </div>
    </div>

    <script>
        function validateCode() {
            const code = document.getElementById('accessCode').value.trim();
            const error = document.getElementById('errorMsg');

            if (code.includes('@')) {
                window.location.href = 'auth.html';
            } else {
                error.style.display = 'block';
                document.getElementById('accessCode').style.borderColor = '#ff4d4d';
            }
        }

        // Allow Enter key to submit
        document.getElementById('accessCode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                validateCode();
            }
        });
    </script>

    <footer
        style="padding: 16px 5% 20px; text-align: center; color: var(--text-secondary); border-top: 1px solid var(--glass-border); margin-top: 24px; font-size: 0.82rem;">
        <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 8px;">
            <a href="impressum.html"
                style="color: var(--text-secondary); text-decoration: none; transition: color 0.2s;"
                onmouseover="this.style.color='var(--accent-blue)'"
                onmouseout="this.style.color='var(--text-secondary)'">Impressum</a>
            <a href="privacy.html" style="color: var(--text-secondary); text-decoration: none; transition: color 0.2s;"
                onmouseover="this.style.color='var(--accent-blue)'"
                onmouseout="this.style.color='var(--text-secondary)'">Privacy Policy</a>
            <a href="terms.html" style="color: var(--text-secondary); text-decoration: none; transition: color 0.2s;"
                onmouseover="this.style.color='var(--accent-blue)'"
                onmouseout="this.style.color='var(--text-secondary)'">Terms & Conditions</a>
        </div>
        <p>&copy; 2026 MindRecoder – Michael Seifert. All Rights Reserved.</p>
    </footer>
</body>

</html>
